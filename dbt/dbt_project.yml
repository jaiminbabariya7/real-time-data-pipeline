name: streaming_etl
version: "1.0.0"
config-version: 2
profile: streaming_etl
model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]
models:
  streaming_etl:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    mart:
      +materialized: table
      +schema: mart
      +partition_by:
        field: event_date
        data_type: date
