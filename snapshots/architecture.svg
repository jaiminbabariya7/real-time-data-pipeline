<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#f8f9fa" rx="12"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Streaming ETL Pipeline — GCP Architecture</text>

  <!-- Sources -->
  <rect x="30" y="60" width="140" height="55" rx="8" fill="#e8f4fd" stroke="#2196f3" stroke-width="1.5"/>
  <text x="100" y="82" text-anchor="middle" font-weight="bold" fill="#1565c0">Web Application</text>
  <text x="100" y="100" text-anchor="middle" fill="#333" font-size="11">User Events</text>

  <!-- Kafka -->
  <rect x="220" y="60" width="140" height="55" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="290" y="82" text-anchor="middle" font-weight="bold" fill="#e65100">Apache Kafka</text>
  <text x="290" y="100" text-anchor="middle" fill="#333" font-size="11">raw-events topic</text>

  <!-- Bridge -->
  <rect x="410" y="60" width="140" height="55" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="480" y="82" text-anchor="middle" font-weight="bold" fill="#6a1b9a">Kafka→PubSub</text>
  <text x="480" y="100" text-anchor="middle" fill="#333" font-size="11">Bridge Service</text>

  <!-- Pub/Sub -->
  <rect x="600" y="60" width="140" height="55" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="670" y="82" text-anchor="middle" font-weight="bold" fill="#1b5e20">Cloud Pub/Sub</text>
  <text x="670" y="100" text-anchor="middle" fill="#333" font-size="11">raw-events topic</text>

  <!-- Arrows top row -->
  <line x1="170" y1="87" x2="218" y2="87" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="87" x2="408" y2="87" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="550" y1="87" x2="598" y2="87" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Dataflow box -->
  <rect x="200" y="175" width="500" height="170" rx="10" fill="#fff8e1" stroke="#ffc107" stroke-width="2"/>
  <text x="450" y="198" text-anchor="middle" font-weight="bold" font-size="14" fill="#f57f17">Apache Beam / Cloud Dataflow</text>

  <rect x="225" y="210" width="110" height="40" rx="6" fill="#fffde7" stroke="#ffca28" stroke-width="1"/>
  <text x="280" y="225" text-anchor="middle" font-size="11" fill="#333">ParseEvent</text>
  <text x="280" y="242" text-anchor="middle" font-size="10" fill="#666">validate + split</text>

  <rect x="355" y="210" width="110" height="40" rx="6" fill="#fffde7" stroke="#ffca28" stroke-width="1"/>
  <text x="410" y="225" text-anchor="middle" font-size="11" fill="#333">EnrichEvent</text>
  <text x="410" y="242" text-anchor="middle" font-size="10" fill="#666">enrich + compute</text>

  <rect x="485" y="210" width="110" height="40" rx="6" fill="#fffde7" stroke="#ffca28" stroke-width="1"/>
  <text x="540" y="225" text-anchor="middle" font-size="11" fill="#333">Window(60s)</text>
  <text x="540" y="242" text-anchor="middle" font-size="10" fill="#666">fixed tumbling</text>

  <rect x="615" y="210" width="65" height="40" rx="6" fill="#ffcdd2" stroke="#ef5350" stroke-width="1"/>
  <text x="648" y="228" text-anchor="middle" font-size="11" fill="#c62828">DLQ</text>
  <text x="648" y="243" text-anchor="middle" font-size="10" fill="#666">invalid</text>

  <!-- inner arrows -->
  <line x1="335" y1="230" x2="353" y2="230" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="465" y1="230" x2="483" y2="230" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="595" y1="230" x2="613" y2="230" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="450" y="285" text-anchor="middle" font-size="11" fill="#888">→ Dual Sink: BigQuery (streaming inserts) + GCS (JSONL archive)</text>
  <text x="450" y="303" text-anchor="middle" font-size="11" fill="#888">→ Dead-Letter Queue: invalid records → BQ DLQ table</text>
  <text x="450" y="321" text-anchor="middle" font-size="11" fill="#888">→ Workers auto-scale 2–10 nodes (Dataflow Streaming Engine)</text>

  <!-- Arrow from PubSub down to Dataflow -->
  <line x1="670" y1="115" x2="670" y2="165" stroke="#555" stroke-width="1.5"/>
  <line x1="670" y1="165" x2="452" y2="173" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BigQuery -->
  <rect x="80" y="410" width="160" height="60" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="160" y="435" text-anchor="middle" font-weight="bold" fill="#0d47a1">BigQuery</text>
  <text x="160" y="452" text-anchor="middle" fill="#333" font-size="11">streaming_etl.events</text>
  <text x="160" y="465" text-anchor="middle" fill="#666" font-size="10">partitioned + clustered</text>

  <!-- GCS -->
  <rect x="290" y="410" width="160" height="60" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="370" y="435" text-anchor="middle" font-weight="bold" fill="#1b5e20">Cloud Storage</text>
  <text x="370" y="452" text-anchor="middle" fill="#333" font-size="11">archive/events/*.jsonl</text>
  <text x="370" y="465" text-anchor="middle" fill="#666" font-size="10">raw JSONL archive</text>

  <!-- DLQ BQ -->
  <rect x="500" y="410" width="160" height="60" rx="8" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <text x="580" y="435" text-anchor="middle" font-weight="bold" fill="#b71c1c">BQ Dead-Letter</text>
  <text x="580" y="452" text-anchor="middle" fill="#333" font-size="11">dead_letter_queue</text>
  <text x="580" y="465" text-anchor="middle" fill="#666" font-size="10">invalid records</text>

  <!-- Arrows to sinks -->
  <line x1="350" y1="345" x2="160" y2="408" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="345" x2="370" y2="408" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="345" x2="580" y2="408" stroke="#c00" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arr)"/>

  <!-- dbt box -->
  <rect x="80" y="530" width="160" height="55" rx="8" fill="#fce4ec" stroke="#e91e63" stroke-width="1.5"/>
  <text x="160" y="552" text-anchor="middle" font-weight="bold" fill="#880e4f">dbt on BigQuery</text>
  <text x="160" y="567" text-anchor="middle" fill="#333" font-size="11">staging → mart</text>
  <text x="160" y="580" text-anchor="middle" fill="#666" font-size="10">fct_events, dim_users</text>

  <!-- Airflow box -->
  <rect x="290" y="530" width="160" height="55" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/>
  <text x="370" y="552" text-anchor="middle" font-weight="bold" fill="#1a237e">Apache Airflow</text>
  <text x="370" y="567" text-anchor="middle" fill="#333" font-size="11">Orchestration DAG</text>
  <text x="370" y="580" text-anchor="middle" fill="#666" font-size="10">daily @ 02:00 UTC</text>

  <!-- Terraform box -->
  <rect x="500" y="530" width="160" height="55" rx="8" fill="#e0f2f1" stroke="#009688" stroke-width="1.5"/>
  <text x="580" y="552" text-anchor="middle" font-weight="bold" fill="#004d40">Terraform IaC</text>
  <text x="580" y="567" text-anchor="middle" fill="#333" font-size="11">GCS, Pub/Sub, BQ</text>
  <text x="580" y="580" text-anchor="middle" fill="#666" font-size="10">SA + IAM roles</text>

  <!-- Arrows to dbt/airflow -->
  <line x1="160" y1="470" x2="160" y2="528" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="470" x2="370" y2="528" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>